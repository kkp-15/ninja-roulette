<style>
/* 配信カウンターの OBS 表示ページ（ウィンドウキャプチャで取り込む）。操作ボタン・広告・説明文は映さない。
   中身は 1920x1080 の舞台を作り、ウィンドウの大きさに合わせて縮める（どの大きさでもスクロールしない）。
   2026-10-22 枠は kit の重ね表示型 k-view-ov（.k-ov の中に 1920x1080 の舞台。置き方 band／corner は舞台の中で決める）。
   背景は kit の KKit.view（?bg= ＞ 操作画面の選択〈k-view-bg:kkp-counter〉＞ green）: green（既定・OBSのクロマキーで抜く）/ clear（透過）/ cream。待ち画面は k-ov-idle */
/* kit b0046ef の足りない所の回避（kit を直したら消す）: k-view-ov の body{background:transparent} が緑・白・黒・色の背景と同じ強さで後にあり、透過になってしまう */
[data-k-bg="green"] body.k-view.k-view-ov{background:#00b140}
[data-k-bg="white"] body.k-view.k-view-ov{background:#fff}
[data-k-bg="black"] body.k-view.k-view-ov{background:#000}
[data-k-bg="color"] body.k-view.k-view-ov{background:var(--k-view-bg,#fbf3e4)}
body.k-view{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:var(--k-sumi)}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.tl{position:absolute;font-family:var(--k-bold);color:var(--k-sumi)}
.seal{display:inline-grid;place-items:center;flex:none;background:url(/kit/img/d4-seal.webp) center/100% 100% no-repeat;color:#fff;font-family:var(--k-head);font-weight:800;line-height:1}
.rule{display:flex;align-items:center;min-width:0;overflow:hidden;transform:none;color:#fff;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;letter-spacing:.06em;line-height:1.15;text-shadow:0 0 4px var(--k-sumi);word-break:auto-phrase;text-wrap:balance;font-feature-settings:"palt" 1}
/* 墨の帯は kit の .k-hd（入り・真ん中・端の3枚）。1920 の舞台で高さがあるので、入りと端の幅だけ広げる */
.rule.k-hd,.fx-out .who.k-hd{background-size:120px 100%,26px 100%,calc(100% - 128px) 100%;background-position:0 0,100% 0,110px 0;text-wrap:balance;letter-spacing:.06em}
.fx-out .who.k-hd{font-family:"M PLUS Rounded 1c",sans-serif;line-height:normal}
.tl-corner .rule.k-hd{background-size:96px 100%,22px 100%,calc(100% - 104px) 100%;background-position:0 0,100% 0,88px 0}
.big-out{font-family:var(--k-bold);color:var(--k-shu);text-shadow:4px 0 0 var(--k-sumi),-4px 0 0 var(--k-sumi),0 4px 0 var(--k-sumi),0 -4px 0 var(--k-sumi),4px 4px 0 var(--k-sumi),-4px -4px 0 var(--k-sumi),4px -4px 0 var(--k-sumi),-4px 4px 0 var(--k-sumi);font-variant-numeric:tabular-nums;display:inline-block;line-height:1}
.p{position:relative;min-width:0}
.rule>span{display:block;min-width:0;max-width:100%}
.tl .p .nm.two{white-space:normal;word-break:break-all;line-height:1.15;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-align:center}
.p .nm{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;font-feature-settings:"palt" 1}
.p .of{font-family:var(--k-bold);color:var(--k-text-2);font-variant-numeric:tabular-nums}
.p .bm{position:absolute;display:none;place-items:center;background:url(/kit/img/d4-hanko.webp) center/100% 100% no-repeat;color:var(--k-shu);font-family:var(--k-head);font-weight:800;transform:rotate(-10deg)}
.p.over .bm{display:grid}

/* 下の帯 */
.tl-band{left:60px;right:60px;bottom:44px;height:220px;display:none;align-items:center;gap:24px;padding:0 30px 0 26px;background:var(--k-kinari) url(/kit/img/d4-washi.webp) 0 0/480px auto;border:6px solid var(--k-sumi);border-radius:14px;box-shadow:10px 10px 0 var(--k-sumi)}
.stage[data-place="band"] .tl-band{display:flex}
.tl-band .head{display:flex;align-items:center;gap:4px;flex:none;width:560px}
.tl-band .seal{width:112px;height:112px;font-size:58px}
.tl-band .rule{width:440px;min-height:130px;padding:16px 34px 18px 50px;box-sizing:border-box}
.tl-band .ppl{flex:1;min-width:0;display:flex;gap:8px;align-self:stretch;padding:14px 0 10px}
.tl-band .p{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 8px;border-left:4px solid var(--k-line-soft)}
.tl-band .p:first-child{border-left:0}
.tl-band .p .nm{max-width:100%;font-size:44px;line-height:1.25}
.tl-band .p .ct{display:flex;align-items:baseline;gap:6px}
.tl-band .p .big-out{font-size:120px}
.tl-band .p .of{font-size:44px}
.tl-band .p .bm{right:-4px;top:-66px;width:96px;height:96px;font-size:46px}

/* 右上に小さく */
.tl-corner{right:40px;top:40px;width:560px;display:none;padding:0 0 14px;background:var(--k-kinari) url(/kit/img/d4-washi.webp) 0 0/480px auto;border:6px solid var(--k-sumi);border-radius:14px;box-shadow:10px 10px 0 var(--k-sumi)}
.stage[data-place="corner"] .tl-corner{display:block}
.tl-corner .head{display:flex;align-items:center;gap:2px;margin:-22px 0 6px -24px}
.tl-corner .seal{width:88px;height:88px;font-size:46px}
.tl-corner .rule{flex:1;min-height:96px;margin-right:12px;padding:12px 30px 14px 40px;box-sizing:border-box}
.tl-corner .p{display:flex;align-items:center;gap:14px;padding:2px 26px 2px 76px;height:84px}
.tl-corner .p+.p{border-top:3px solid var(--k-line-soft)}
.tl-corner .p .nm{flex:1;font-size:42px;line-height:1.2}
.tl-corner .p .ct{display:flex;align-items:baseline;gap:6px;flex:none}
.tl-corner .p .big-out{font-size:76px}
.tl-corner .p .of{font-size:42px;min-width:64px}
.tl-corner .p .bm{left:4px;top:5px;width:76px;height:76px;font-size:42px}

/* アウトの判子 */
.fx-out{position:absolute;left:50%;top:40%;width:900px;margin-left:-450px;margin-top:-260px;display:none;flex-direction:column;align-items:center;pointer-events:none}
.fx-out.show{display:flex}
.fx-out .hk{display:grid;place-items:center;width:420px;height:420px;background:url(/kit/img/d4-hanko.webp) center/100% 100% no-repeat;font-family:var(--k-head);font-weight:800;font-size:108px;color:var(--k-shu);line-height:1;transform:rotate(-8deg)}
.fx-out .who{display:flex;align-items:baseline;gap:18px;max-width:900px;box-sizing:border-box;margin-top:-10px;padding:20px 64px 26px 80px;transform:none;color:#fff;text-shadow:0 0 4px var(--k-sumi);white-space:nowrap}
.fx-out .who b{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-size:56px}
.fx-out .who span{flex:none;font-family:var(--k-bold);font-size:48px}
.fx-out.show .hk{animation:k-stamp .35s cubic-bezier(.3,1.4,.5,1) both}
.fx-out.show .who{animation:fade-up .3s ease-out .15s both}

/* 罰ゲーム（届いたとき＝少しだけ／引いたとき＝消すまで出す） */
.fx-batsu{position:absolute;left:50%;top:40%;width:1240px;margin-left:-620px;transform:translateY(-50%);display:none;pointer-events:none}
.fx-batsu.show{display:block}
.fx-batsu .scr{position:relative;border-style:solid;border-width:40px 110px;border-image:url(/kit/img/d3-scroll.webp) 56 84 fill / 40px 110px stretch;padding:8px 0 16px;text-align:center}
.fx-batsu .lab{display:block;font-family:var(--k-brush);font-size:60px;letter-spacing:.08em;line-height:1.2}
.fx-batsu .nm{display:block;font-weight:900;font-size:120px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-feature-settings:"palt" 1}
.fx-batsu .sub{display:block;font-weight:800;font-size:44px;color:var(--k-text-2)}
.fx-batsu .item{display:none;margin:6px 20px 0;font-weight:900;font-size:72px;line-height:1.25;color:var(--k-shu);text-shadow:3px 0 0 var(--k-sumi),-3px 0 0 var(--k-sumi),0 3px 0 var(--k-sumi),0 -3px 0 var(--k-sumi),3px 3px 0 var(--k-sumi),-3px -3px 0 var(--k-sumi),3px -3px 0 var(--k-sumi),-3px 3px 0 var(--k-sumi);word-break:auto-phrase;text-wrap:balance;font-feature-settings:"palt" 1}
.fx-batsu.drawn .item{display:block}
.fx-batsu.drawn .nm{font-size:76px}
.fx-batsu .rar{display:none;position:absolute;right:-20px;top:-26px;padding:4px 18px;border:4px solid var(--k-sumi);border-radius:8px;font-family:var(--k-bold);font-size:42px;color:#fff;text-shadow:var(--k-outline);transform:rotate(6deg)}
.fx-batsu.drawn .rar{display:block}
.fx-batsu.drawn .rar[hidden]{display:none}
/* 7〜9項目 */
.stage[data-many="1"] .tl-band .head{width:400px}
.stage[data-many="1"] .tl-band .seal{width:90px;height:90px;font-size:46px}
.stage[data-many="1"] .tl-band .rule{width:306px;padding:14px 24px 16px 40px}
.stage[data-many="1"] .tl-band .ppl{gap:4px}
.stage[data-many="1"] .tl-band .p{padding:0 4px}
.stage[data-many="1"] .tl-band .p .of{font-size:42px}
.stage[data-many="1"] .tl-band .p .bm{width:84px;height:84px;font-size:42px;top:-60px}
.stage[data-many="1"] .tl-corner .p{height:70px}
.stage[data-many="1"] .tl-corner .p .big-out{font-size:62px}
.fx-batsu .item.one{white-space:nowrap}
.fx-batsu.show .scr{animation:k-unroll .6s cubic-bezier(.2,.8,.2,1) both}
/* 右上に小さく: 数の表（最大9行）と重ならないよう、罰ゲームとアウトの判子は左に寄せる */
.stage[data-place="corner"] .fx-batsu{top:52%;left:50px;margin-left:0;width:1200px}
.stage[data-place="corner"] .fx-out{left:calc(50% - 230px)}


@keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-6deg)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.bump{animation:bump .45s cubic-bezier(.3,1.4,.5,1)}
.fadeout{transition:opacity .4s;opacity:0}
@media (prefers-reduced-motion:reduce){.bump,.fx-out.show .hk,.fx-out.show .who,.fx-batsu.show .scr{animation:none}}
</style>
</head>
<body class="k-view k-view-ov">
<div class="k-ov" data-k-place="full">
<div class="stage" id="stage" data-place="band">
  <div class="tl tl-band"><div class="head"><span class="seal">縛</span><span class="rule k-hd" data-rule></span></div><div class="ppl" data-ppl></div></div>
  <div class="tl tl-corner"><div class="head"><span class="seal">縛</span><span class="rule k-hd" data-rule></span></div><div data-ppl></div></div>
  <div class="fx-out" id="fxOut" aria-hidden="true"><div class="hk">アウト</div><div class="who k-hd"><b id="outWho"></b><span id="outN"></span></div></div>
  <div class="fx-batsu" id="fxBatsu" aria-hidden="true">
    <div class="scr">
      <span class="rar" id="bRar"></span>
      <span class="lab">罰ゲーム</span>
      <span class="nm" id="bWho"></span>
      <span class="sub" id="bSub"></span>
      <span class="item" id="bItem"></span>
    </div>
  </div>
</div>
</div>
<div class="k-view-idle k-ov-idle" hidden><b>配信カウンター</b><p>まもなく始まります</p><small>操作画面（配信カウンター）を同じブラウザで開くと、ここに数が出ます</small></div>
<div class="k-ov-credit k-top" id="credit">roulette.kkpwebninja.com/counter</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var pv = q.get('pv') === '1';   // 操作画面の中の小さな見本
  var lock = { place: q.get('place'), credit: q.get('credit') };
  // 背景は kit の KKit.view（?bg= の transparent も読める）。操作画面の中の見本では透過をクリームで見せる
  var V = KKit.view({ ch: 'kkp-counter', def: 'green', stage: 'body', onBg: function (b) { if (pv && b === 'clear') document.documentElement.setAttribute('data-k-bg', 'cream'); } });
  var S = null, lastId = 0, outT = 0, batsuT = 0;
  var COLOR = { N: '#b9783f', R: '#8e9cae', SR: '#e3a400', SSR: '#ff3d7f' };
  var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var stage = $('stage');

  function nm(i) { var v = S && S.names && S.names[i] ? String(S.names[i]).trim() : ''; return v || ('参加者' + (i + 1)); }
  function opt(k, d) { var v = lock[k] != null ? lock[k] : (S && S[k] != null ? S[k] : d); return v; }

  // はみ出す名前は字を小さく（それでも入らなければ…で切る）
  function shrink(el, max, min, two) {
    var fs = max; el.classList.remove('two'); el.style.fontSize = fs + 'px';
    while (fs > min && el.scrollWidth > el.clientWidth + 1) { fs -= 2; el.style.fontSize = fs + 'px'; }
    if (!two || el.scrollWidth <= el.clientWidth + 1) return;
    // 1行に入らない長い名前は2行に（字はあまり小さくしない）
    el.classList.add('two'); fs = Math.max(min, two);
    el.style.fontSize = fs + 'px';
    while (fs > 20 && el.scrollHeight > fs * 1.15 * 2.5) { fs -= 2; el.style.fontSize = fs + 'px'; }
  }
  // 縛りの名前は2行まで。長いほど小さく
  function ruleSize(el, max, min) {
    var sp = el.firstChild, fs = max; el.style.fontSize = fs + 'px';
    while (fs > min && (sp.offsetHeight > fs * 1.15 * 2 + 2 || sp.scrollWidth > sp.clientWidth + 1)) { fs -= 2; el.style.fontSize = fs + 'px'; }
  }

  function render() {
    if (!S) return;
    var place = /^(band|corner)$/.test(opt('place', 'band')) ? opt('place', 'band') : 'band';
    stage.dataset.place = place;
    var cr = opt('credit', true); $('credit').hidden = cr === false || cr === '0' || cr === 0;
    $('credit').classList.toggle('k-top', place !== 'corner');   // 下の帯なら右上・右上に小さくなら右下
    var rule = String(S.rule || '').trim() || '縛り';
    var n = Math.min(9, Math.max(1, S.n | 0)), th = Math.min(20, Math.max(1, S.th | 0));
    stage.dataset.many = n >= 7 ? '1' : '';   // 7〜9項目は帯の左（縛り）を細くし、数と名前を少し小さく
    document.querySelectorAll('[data-rule]').forEach(function (el) {
      el.innerHTML = '<span></span>'; el.firstChild.textContent = rule;
      if (el.closest('.tl-band')) ruleSize(el, 54, 26); else ruleSize(el, 44, 22);
    });
    document.querySelectorAll('[data-ppl]').forEach(function (box) {
      box.innerHTML = '';
      for (var i = 0; i < n; i++) {
        var c = S.counts[i] | 0;
        var p = document.createElement('div'); p.className = 'p' + (c >= th ? ' over' : ''); p.dataset.i = i;
        p.innerHTML = '<span class="bm">罰</span><span class="nm"></span><span class="ct"><b class="big-out" data-c></b><span class="of">/' + th + '</span></span>';
        p.querySelector('.nm').textContent = nm(i);
        p.querySelector('[data-c]').textContent = c;
        box.appendChild(p);
      }
    });
    if (place === 'band') {
      var big = n <= 3 ? 52 : n <= 4 ? 46 : n <= 6 ? 40 : 32;
      stage.querySelectorAll('.tl-band .nm').forEach(function (el) { shrink(el, big, n >= 7 ? 24 : 34, n >= 7 ? 24 : 32); });
      stage.querySelectorAll('.tl-band .big-out').forEach(function (el) { el.style.fontSize = (n <= 4 ? 120 : n <= 6 ? 104 : 88) + 'px'; });
    } else {
      stage.querySelectorAll('.tl-corner .nm').forEach(function (el) { shrink(el, n >= 7 ? 36 : 42, 26, 26); });
    }
    showPersist();
  }
  function bump(i) {
    if (reduce) return;
    stage.querySelectorAll('[data-i="' + i + '"] [data-c]').forEach(function (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); });
  }

  // 消す途中（0.4秒）に次の表示が来たら、消す予約を取り消す（罰ゲームを引いた直後に巻物が消えていた）
  function hideFx(el) { el.classList.add('fadeout'); clearTimeout(el._hT); el._hT = setTimeout(function () { el.classList.remove('show', 'fadeout', 'drawn'); }, 400); }
  function showOut(i) {
    var fx = $('fxOut');
    if (!S.show) $('fxBatsu').classList.remove('show');
    $('outWho').textContent = nm(i); $('outN').textContent = (S.counts[i] | 0) + '回目';
    clearTimeout(fx._hT); fx.classList.remove('show', 'fadeout'); void fx.offsetWidth; fx.classList.add('show');
    clearTimeout(outT); outT = setTimeout(function () { hideFx(fx); }, 1300);
  }
  function showReach(i) {
    var fx = $('fxBatsu'); $('fxOut').classList.remove('show');
    fx.classList.remove('drawn');
    $('bWho').textContent = nm(i);
    $('bSub').textContent = (String(S.rule || '').trim() || '縛り') + 'で ' + (S.counts[i] | 0) + '回アウト';
    clearTimeout(fx._hT); fx.classList.remove('show', 'fadeout'); void fx.offsetWidth; fx.classList.add('show');
    clearTimeout(batsuT); batsuT = setTimeout(function () { if (!S.show) hideFx(fx); }, 3200);
  }
  // 引いた罰ゲームは、操作画面で「表示を消す」まで出したまま
  var shownKey = '';
  function showPersist() {
    var fx = $('fxBatsu'), s = S.show;
    if (!s) { if (fx.classList.contains('drawn')) { shownKey = ''; hideFx(fx); } return; }
    var key = s.id + '';
    $('bWho').textContent = nm(s.i);
    $('bSub').textContent = '';
    $('bItem').textContent = s.text || '';
    var r = $('bRar'); r.textContent = s.r || ''; r.style.background = COLOR[s.r] || COLOR.N; r.hidden = !s.r;
    fx.classList.add('drawn');
    clearTimeout(batsuT);
    if (key !== shownKey) { shownKey = key; fx.classList.remove('show', 'fadeout'); void fx.offsetWidth; }
    clearTimeout(fx._hT); fx.classList.remove('fadeout'); fx.classList.add('show');
    // まず1行で入る大きさを探す（56pxまで）。入らなければ2行にして、文の切れ目で折る（変な所で改行しない）
    var it = $('bItem'); var fs = 72; it.classList.add('one'); it.style.fontSize = fs + 'px';
    while (fs > 56 && it.scrollWidth > it.clientWidth + 1) { fs -= 2; it.style.fontSize = fs + 'px'; }
    if (it.scrollWidth > it.clientWidth + 1) {
      it.classList.remove('one'); fs = 66; it.style.fontSize = fs + 'px';
      while (fs > 40 && it.scrollHeight > fs * 1.25 * 2 + 4) { fs -= 2; it.style.fontSize = fs + 'px'; }
    }
    shrink($('bWho'), 76, 40);
  }

  function handle(m) {
    if (!m || !m.s) return;
    if (m.id && m.id === lastId) return;
    lastId = m.id || lastId;
    S = m.s; V.idle(false);
    render();
    var f = m.fx; if (!f) return;
    if (f.k === 'out') { bump(f.i); showOut(f.i); }
    else if (f.k === 'reach') { bump(f.i); showReach(f.i); }
    else if (f.k === 'minus') bump(f.i);
  }

  // 1920x1080 の舞台をウィンドウに合わせて縮める（横長でも縦長でも全体が入る）
  function fit() {
    var W = window.innerWidth, H = window.innerHeight, s = Math.min(W / 1920, H / 1080);
    stage.style.transform = 'translate(' + Math.round((W - 1920 * s) / 2) + 'px,' + Math.round((H - 1080 * s) / 2) + 'px) scale(' + s + ')';
  }
  fit();

  // 操作ページ（同じブラウザ）から kit の KKit.live で受け取る（3秒ごとに hello＝操作ページの「つながっています」）。
  // 開いたときの最初の1つは数だけ出す（アウト・罰ゲームの演出は出し直さない）
  var first = true;
  function onState(m) {
    if (first) { first = false; if (m && m.s) { handle({ s: m.s, id: m.id }); return; } V.idle(!pv, '配信カウンター'); }
    else handle(m);
    if (!S) { S = { rule: '敬語禁止', n: 3, names: [], counts: [0, 0, 0, 0, 0, 0, 0, 0, 0], th: 3 }; render(); }
  }
  // 操作画面の中の見本（iframe）は kit が受け取るだけ（watch）にする＝「つながっています」を本物の表示ページだけに
  KKit.live({ ch: 'kkp-counter', role: 'view', onState: function (m) { onState(m); } }).start();
  // 字のデータが後から届いた・窓の大きさが変わった（kit の KKit.view.refit）
  KKit.view.refit(function () { fit(); render(); });
  if (!pv) kkpEvent('counter_view_open', { from: 'local' });
})();
</script>
