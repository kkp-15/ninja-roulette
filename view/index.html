<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信ルーレット OBS表示ページ</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://roulette.kkpwebninja.com/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap&text=NRS%E7%B5%90%E6%9E%9C%E6%AE%8B%E3%82%8A0123456789%2F" rel="stylesheet">
<link rel="stylesheet" href="/kit/kit.css">
<script src="/kit/kit.js"></script>
<script src="/ga.js"></script>
<style>
/* OBS のウィンドウキャプチャで取り込む表示ページ（別端末用のURLはブラウザソースでも動く）: 背景は透過（既定）。操作ボタン・広告・説明文は映さない
   置き方: full（全画面）/ band（下の帯）/ corner（右下に小さく）。縦長の画面では縦に並べる */
html,body{margin:0;height:100%;overflow:hidden}
body{background:transparent;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;color:#2b2b2b}
.stage{position:fixed;display:flex;align-items:center;justify-content:center;gap:3vw}
.place-full{inset:0;padding:3vh 3vw}
.place-band{left:0;right:0;bottom:0;height:36vh;padding:1.5vh 2vw;justify-content:flex-start;gap:2vw}
.place-corner{right:2vw;bottom:3vh;width:44vw;height:56vh;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:1.5vh}
.layout-result .wheelbox{display:none}
.layout-wheel .resbox{display:none}
.wheelbox{position:relative;flex:0 0 auto}
#wheel{display:block}
.resbox{flex:1 1 auto;min-width:0;display:flex;align-items:center}
.place-corner .resbox{flex:0 0 auto;width:100%}
.gstage{position:fixed}
.gstage[hidden]{display:none}
.g-full{inset:0}
.g-band{left:0;right:0;bottom:0;height:36vh}
.g-corner{right:2vw;bottom:3vh;width:44vw;height:56vh}
.credit,.hint{position:fixed;font-size:max(15px,2.19vw);font-weight:800;color:#fff;text-shadow:0 0 3px #2b2b2b,2px 2px 0 #2b2b2b,-2px -2px 0 #2b2b2b,2px -2px 0 #2b2b2b,-2px 2px 0 #2b2b2b;pointer-events:none}
.credit{right:12px;bottom:8px;opacity:.9}
.credit.top{bottom:auto;top:8px}
.credit[hidden],.hint[hidden]{display:none}
.hint{left:12px;bottom:8px}
/* 1920x1080 を1/3に縮めて置いても読める下限（42px＝2.19vw）。gacha.js が後から足す CSS より強くするため id で書く */
#gstage .tl-tag,#resbox .tl-tag{font-size:max(.62em,2.19vw)}
#gstage .tl-sub,#resbox .tl-sub{font-size:max(.34em,2.19vw)}
#gstage .tl .tl-txt,#resbox .tl .tl-txt{font-size:max(1em,2.19vw)}
#gstage .tl.m .tl-txt,#resbox .tl.m .tl-txt{font-size:max(.82em,2.19vw)}
#gstage .tl.l .tl-txt,#resbox .tl.l .tl-txt{font-size:max(.68em,2.19vw)}
@media(max-aspect-ratio:1/1){
  .place-full{flex-direction:column}
  .place-band{height:30vh}
  .place-corner{width:70vw;height:44vh}
  .g-band{height:30vh}
  .g-corner{width:70vw;height:44vh}
}
</style>
</head>
<body>
<div class="stage place-full layout-both" id="stage">
  <div class="wheelbox"><canvas id="wheel" width="10" height="10"></canvas></div>
  <div class="resbox" id="resbox"></div>
</div>
<div class="gstage g-full" id="gstage" hidden></div>
<div class="hint" id="hint" hidden>クリックかスペースキーで回す</div>
<div class="credit" id="credit">roulette.kkpwebninja.com</div>
<script src="/wheel.js"></script>
<script src="/gacha.js"></script>
<script src="/odai-gacha/packs.js"></script>
<script>
(function () {
  'use strict';
  var K = window.KkpWheel, G = window.KkpGacha;
  var $ = function (id) { return document.getElementById(id); };
  var wheel = new K.Wheel($('wheel'));
  if (!location.search || !new URLSearchParams(location.search).has('items')) wheel.emptyText = ['操作ページで', '回すと出ます'];   // 項目が届く前の盤に薄く出す
  wheel.setArt(K.ART);
  var q = new URLSearchParams(location.search);
  var remote = q.has('items');   // 別端末モード: 項目はURLから。回す操作はこのページで
  var gremote = q.has('gacha');  // 別端末のお題ガチャ: パックはURLから。このページで引く
  var settings = { bg: 'transparent', layout: 'both', place: 'full', speed: 'normal', size: 2, ink: 'dark', credit: true, sound: false };
  var items = [], lastId = 0, gctl = null, lastResult = '';

  function load(k) { try { var v = localStorage.getItem(k); return v === null ? null : JSON.parse(v); } catch (e) { return null; } }
  function place() { return /^(full|band|corner)$/.test(settings.place) ? settings.place : 'full'; }
  function scale() { return [0, 0.8, 1, 1.25][settings.size] || 1; }
  function band() { return settings.ink === 'light' ? 'dark' : 'orange'; }

  function applySettings(s) {
    if (!s) return;
    settings = Object.assign(settings, s);
    wheel.fx = settings.wfx === 'lite' || settings.wfx === 'off' ? settings.wfx : 'full';
    document.body.style.background = settings.bg === 'transparent' ? 'transparent' : settings.bg;
    $('stage').className = 'stage place-' + place() + ' layout-' + (settings.layout || 'both');
    $('gstage').className = 'gstage g-' + place();
    $('credit').hidden = settings.credit === false || settings.credit === 0;
    $('credit').className = 'credit' + (place() === 'full' ? '' : ' top');
    fit();
    if (lastResult && !wheel.spinning) showResult(lastResult, false);
  }
  function setItems(list) { items = list || []; wheel.setItems(items); }
  function showResult(label, anim) {
    lastResult = label || '';
    var box = $('resbox'); box.innerHTML = '';
    if (!label) return;
    var t = G.telop(box, { tag: '結果', text: label, band: band() });
    if (anim) t.classList.add('in');
  }
  // お題ガチャ（置き方に合わせた範囲で演出）
  function showGacha(on) {
    $('gstage').hidden = !on; $('stage').style.visibility = on ? 'hidden' : '';
    if (on) wheel.clearStar($('wheel').parentNode);
    if (!on && $('gstage')._kg) $('gstage')._kg.destroy();
  }
  function runGacha(msg, quiet) {
    if (!quiet) { if (msg.id && msg.id === lastId) return; lastId = msg.id || 0; }
    if (msg.settings) applySettings(msg.settings);
    showGacha(true);
    var o = { rarity: msg.rarity, text: msg.text, packName: msg.packName, scale: scale(), place: place(), band: band(), speed: msg.speed || settings.speed };
    gctl = quiet ? G.show($('gstage'), o) : G.play($('gstage'), Object.assign(o, { fx: msg.fx || 'full', sound: !!settings.sound }));
  }
  // quiet: 開き直したときの最後の画面（回す演出・手裏剣・音なしで止まった所だけ出す）
  function runSpin(msg, quiet) {
    if (msg.id && msg.id === lastId) return;
    lastId = msg.id || 0;
    showGacha(false);
    if (msg.items) setItems(msg.items);
    if (msg.settings) applySettings(msg.settings);
    showResult('', false);
    var dur = K.reduce || quiet ? 1 : msg.dur;
    if (!quiet) wheel.throwStar($('wheel').parentNode, msg.final, dur, settings.speed, settings.sound ? K.sound : null);
    wheel.spin(msg.from, msg.final, dur, function (idx) {
      var rv = msg.reveal && msg.reveal[idx];
      if (rv) { lastResult = ''; var box = $('resbox'); box.innerHTML = ''; var t = G.telop(box, { rarity: rv.r, text: rv.text, packName: rv.packName, band: band() }); if (!quiet) t.classList.add('in'); }
      else showResult(items[idx] ? items[idx].label : '', !quiet);
      if (settings.sound && !quiet) K.sound('done');
    });
  }
  wheel.onTick = function () { if (settings.sound) K.sound('tick'); };

  function handle(msg) {
    if (!msg || !msg.t) return;
    if (msg.t === 'spin') runSpin(msg);
    else if (msg.t === 'gacha') runGacha(msg);
    else if (msg.t === 'cfg') { if (msg.settings) applySettings(msg.settings); }
    else if (msg.t === 'gskip') { if (gctl && gctl.playing()) gctl.skip(); }
    else if (msg.t === 'state' && msg.kind === 'gacha') { if (!(gctl && gctl.playing())) runGacha(msg, true); }
    else if (msg.t === 'state') {
      if (gctl && gctl.playing()) return;
      showGacha(false);
      if (msg.settings) applySettings(msg.settings);
      if (!wheel.spinning) { setItems(msg.items); if (msg.result && msg.result !== lastResult) showResult(msg.result, false); }
    }
  }

  function look() {
    return { bg: q.get('bg') || 'transparent', layout: q.get('layout') || 'both', place: q.get('place') || 'full', wfx: q.get('wfx') || 'full', speed: q.get('speed') || 'normal', size: parseInt(q.get('size') || '2', 10), ink: q.get('ink') || 'dark', credit: q.get('credit') !== '0', sound: q.get('sound') === '1' };
  }
  if (gremote) {
    // 別端末: このページでお題ガチャを引く（クリック・スペース。演出中ならスキップ）
    var gp = (q.get('gacha') || '').split(',').filter(Boolean);
    if (!gp.length) gp = window.KKP_ODAI_PACKS.filter(function (p) { return p.on; }).map(function (p) { return p.id; });
    var gpool = G.buildPool(window.KKP_ODAI_PACKS, gp, '', []);
    var gseenKey = 'kkp_odai_seen_remote', gseen = load(gseenKey) || [];
    var gnames = {}; window.KKP_ODAI_PACKS.forEach(function (p) { gnames[p.id] = p.name; });
    applySettings(Object.assign(look(), { layout: 'result' }));
    $('hint').textContent = 'クリックかスペースキーでお題ガチャを引く'; $('hint').hidden = false;
    var gFx = /^(full|lite|off)$/.test(q.get('fx') || '') ? q.get('fx') : 'full';
    var gHere = function () {
      if (gctl && gctl.playing()) { gctl.skip(); return; }
      if (!gpool.length) return;
      var d = G.draw(gpool, gseen); if (!d) return;
      if (d.resetR) gseen = G.clearRarity(gpool, gseen, d.resetR);
      gseen.push(d.item.id); try { localStorage.setItem(gseenKey, JSON.stringify(gseen)); } catch (e) {}
      $('hint').hidden = true;
      kkpEvent('gacha_draw', { rarity: d.item.r, mode: 'remote', fx: gFx });
      runGacha({ id: Date.now(), rarity: d.item.r, text: d.item.text, packName: gnames[d.item.pack] || '', fx: gFx, speed: settings.speed });
    };
    document.addEventListener('click', gHere);
    document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); gHere(); } });
  } else if (remote) {
    setItems(K.parseItems(q.get('items')));
    applySettings(look());
    $('hint').hidden = false;
    var spinHere = function () {
      if (wheel.spinning || items.length < 2) return;
      $('hint').hidden = true;
      kkpEvent('spin', { from: 'remote' });
      runSpin({ from: wheel.angle, final: wheel.pickFinal(5 + Math.floor(Math.random() * 2)), dur: K.spinDur(settings.speed), id: Date.now() });
    };
    document.addEventListener('click', spinHere);
    document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); spinHere(); } });
  } else {
    // 同じブラウザの操作ページ（ルーレット・お題ガチャ）から kit の KKit.live で受け取る（3秒ごとに hello＝操作ページの「つながっています」）。
    // 開いたときの最初の1つは、演出を動かさずに最後の画面だけ出す（回す→止まった所・ガチャ→結果・スキップ／背景→直前の結果）
    var first = true;
    KKit.live({ ch: 'kkp-roulette', role: 'view', onState: function (m) {
      if (!m) { first = false; return; }
      if (!first) { handle(m); return; }
      first = false;
      if (m.t === 'spin') runSpin(m, true);
      else if (m.t === 'gacha') { runGacha(m, true); lastId = m.id || 0; }
      else if (m.t === 'gskip' || m.t === 'cfg') { if (m.settings) applySettings(m.settings); if (m.st) handle(m.st); }
      else handle(m);
    } }).start();
  }

  // 盤面とテロップの大きさ（置き方ごと）
  function fit() {
    var W = window.innerWidth, H = window.innerHeight, s, th, layout = settings.layout || 'both', p = place(), port = H > W;
    if (p === 'band') { var bh = H * (port ? 0.3 : 0.36); s = bh * 0.94; th = Math.min(W * (port ? 0.05 : 0.034), bh * 0.2); }
    else if (p === 'corner') { var cw = W * (port ? 0.7 : 0.44), chh = H * (port ? 0.44 : 0.56); s = Math.min(cw, chh) * 0.66; th = Math.min(cw * 0.075, chh * 0.11); if (layout === 'wheel') s = Math.min(cw, chh) * 0.95; }
    else if (layout === 'wheel') { s = Math.min(W, H) * 0.9; th = 0; }
    else if (port) { s = Math.min(W * 0.9, H * 0.52); th = Math.min(W * 0.07, H * 0.05); }
    else { s = Math.min(W * 0.46, H * 0.9); th = layout === 'result' ? Math.min(W * 0.05, H * 0.095) : Math.min(W * 0.04, H * 0.08); }
    // 盤の字は、1920x1080 を1/3に縮めて置いても14px相当（実寸42px）を下回らない（入らない字は省く・細いマスは字なし）
    wheel.minEff = Math.max(14, 42 * Math.min(W / 1920, H / 1080));
    wheel.resize(Math.max(120, Math.floor(s)));
    $('resbox').style.setProperty('--th', Math.max(16, th * scale()) + 'px');
  }
  window.addEventListener('resize', fit);
  fit();
  // 丸ゴシックの読み込みが終わったら盤面を描き直す（先に描くと細い代わりの字になる）
  try { document.fonts.ready.then(function () { wheel.buildFace(); wheel.draw(); }); } catch (e) {}
  kkpEvent('view_obs_open', { from: gremote ? 'gacha_remote' : remote ? 'remote' : 'local' });
})();
</script>
</body>
</html>
