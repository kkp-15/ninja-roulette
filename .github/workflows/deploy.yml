name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配信前に非公開ファイルを削除
        # Pages は .assetsignore を読まない。作業メモ・設定は配信しない
        run: rm -rf ./*.md .claude .github .gitignore .assetsignore wrangler.jsonc .wrangler tests _dev
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.85.0"
          command: pages deploy . --project-name=ninja-roulette --branch=main --commit-dirty=true
