<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#fff;font-family:"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:#2b2b2b;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;width:1200px;height:14px;background:#e2600f}
.wheel{position:absolute;left:70px;top:95px;width:440px;height:440px;border-radius:50%;border:12px solid #2b2b2b;box-sizing:border-box;background:conic-gradient(#ffb36b 0 60deg,#ffe3b0 60deg 120deg,#ff9a56 120deg 180deg,#ffd58f 180deg 240deg,#ffc07a 240deg 300deg,#fff0cf 300deg 360deg)}
.wheel:after{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;border:10px solid #2b2b2b;box-sizing:border-box}
.pin{position:absolute;left:265px;top:70px;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:50px solid #e2600f}
.t{position:absolute;left:570px;top:120px;width:580px}
.t h1{font-size:74px;margin:0 0 10px;line-height:1.2;letter-spacing:.02em}
.t p{font-size:30px;margin:0 0 8px;line-height:1.5}
.t .s{font-size:24px;color:#5f5f5f;margin-top:22px}
.res{position:absolute;left:570px;top:395px;border:4px solid #2b2b2b;padding:14px 28px;font-size:34px;font-weight:700;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
.res small{display:block;font-size:16px;font-weight:400;color:#5f5f5f}
.site{position:absolute;right:40px;bottom:26px;font-size:22px;color:#8b6b3d}
</style></head><body>
<div class="bar"></div>
<div class="wheel"></div><div class="pin"></div>
<div class="t"><h1>配信ルーレット</h1><p>お題・企画・視聴者名を貼って回す</p><p>OBSに透過で映せる表示ページつき</p><p class="s">登録不要・無料・項目は端末内だけ</p></div>
<div class="res"><small>結果</small>今日のごはん</div>
<div class="site">roulette.kkpwebninja.com ／ web忍者の砦</div>
</body></html>
